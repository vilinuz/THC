version: '3.8'

services:
  # 1. Trading Bot (Strategy Engine)
  trading-bot:
    build: .
    container_name: trading-bot
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - POSTGRES_DSN=postgresql://postgres:postgres@postgres:5432/trading
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
    depends_on:
      - redis
      - postgres
    networks:
      - trading-net
    command: python main.py --mode daemon

  # 2. Data Ingestion (CryptoFeed)
  feed-manager:
    build: .
    container_name: trading-feed
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_DSN=postgresql://postgres:postgres@postgres:5432/trading
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
    depends_on:
      - redis
      - postgres
    networks:
      - trading-net
    command: python -m data_ingestion.feed_manager

  # 3. Dashboard (Web UI)
  dashboard:
    build: .
    container_name: trading-dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - POSTGRES_DSN=postgresql://postgres:postgres@postgres:5432/trading
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
    depends_on:
      - redis
      - postgres
    networks:
      - trading-net
    command: uvicorn dashboard.app:app --host 0.0.0.0 --port 8000 --reload

  # 4. Infrastructure: Redis
  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - trading-net
    command: redis-server --appendonly yes

  # 5. Infrastructure: Postgres
  postgres:
    image: postgres:15-alpine
    container_name: trading-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=trading
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - trading-net

volumes:
  redis-data:
  postgres-data:


networks:
  trading-net:
    driver: bridge
